name: Main

on:
  schedule:
    - cron: 0 0,12 * * *
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  update-stats:
    name: Update Stats Cards
    environment: gist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: stats
          options: theme=github_dark&show_icons=true
          path: stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top-langs card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: top-langs
          options: theme=github_dark&hide_progress=true&hide=lua
          path: top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          gh api --method PATCH "/gists/${GIST_ID}" \
            -f "files[stats.svg][content]=$(cat stats.svg)" \
            -f "files[top-langs.svg][content]=$(cat top-langs.svg)"
